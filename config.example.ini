[server]
host = 0.0.0.0
port = 8080
database = data/misol.sqlite3
max_recent = 1000
max_body_bytes = 65536

[privacy]
store_raw = yes
redact_keys = PASSKEY,PASSWORD,password,stationkey,station_key,key,token,secret,api_key,apikey

[mqtt]
enabled = no
host = 127.0.0.1
port = 1883
topic_prefix = misol-local
username =
password =
retain = no

[crosscheck]
# Optional external comparison and fusion layer. Disabled until a location is set.
enabled = no
latitude = 0.0
longitude = 0.0
interval_seconds = 600
timeout_seconds = 5
max_age_seconds = 1800
# compare_only, fill_gaps, or guarded
fusion_mode = fill_gaps

[openweather]
enabled = no
api_key =
endpoint = https://api.openweathermap.org/data/2.5/weather

[openmeteo]
# Model-based current conditions. No API key required for ordinary use.
enabled = no
endpoint = https://api.open-meteo.com/v1/forecast

[satellite]
# Satellite-derived solar radiation. No API key required for ordinary use.
enabled = no
endpoint = https://satellite-api.open-meteo.com/v1/archive

[quality]
enabled = yes
temporal_window_seconds = 3600
# Optional safety valve. Raw data is still kept even when a derived value is rejected.
reject_impossible = no

[calibration]
# Learn long-term bias only from agreeing independent external references.
enabled = yes
# Keep no initially. Candidate corrections are learned and reported before they are applied.
apply_to_best_estimate = no
min_samples = 24
window_samples = 500
max_mad_fraction = 0.25
