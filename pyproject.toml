[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misol-local"
version = "0.1.1.dev0"
description = "Experimental local receiver for MISOL/Fine Offset-style weather station custom uploads"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TABARC-Code contributors"}]
keywords = ["misol", "ecowitt", "weather-station", "fine-offset", "mqtt"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.scripts]
misol-local = "misol_local.__main__:main"

[tool.setuptools.packages.find]
include = ["misol_local*"]
